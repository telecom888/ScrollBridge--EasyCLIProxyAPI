name: Publish packages to GitCode
on:
  workflow_run:
    workflows: ['Windows release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (for example v0.3.19)
        required: true
permissions:
  contents: read
concurrency:
  group: gitcode-artifacts
  cancel-in-progress: false
jobs:
  packages:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download existing GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag=$(git tag --points-at "$RELEASE_COMMIT" | sort -V | tail -n 1)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo 'No matching stable release tag'; exit 1; fi
          gh release download "$tag" --dir release --pattern 'ScrollBridge-*-win-x64.*' --pattern 'SHA256SUMS-*.txt' --pattern 'scrollbridge-update.json'
      - name: Publish artifacts only
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: node scripts/publish-gitcode.cjs release
