name: Windows release
run-name: Windows release ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
permissions:
  contents: write
concurrency:
  group: windows-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: beta/go-gateway/go.mod
          cache-dependency-path: beta/go-gateway/go.sum
      - run: npm ci
      - run: npm run vendor
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm run dist
        env:
          SCROLLBRIDGE_UPDATE_SIGNING_KEY: ${{ secrets.SCROLLBRIDGE_UPDATE_SIGNING_KEY }}
      - name: Verify Windows update replacement and rollback
        run: node scripts/update-worker-smoke.cjs
      - name: Verify Windows startup registration and desktop failure handling
        run: node scripts/startup-smoke.cjs
      - name: Verify updated desktop window is visible
        run: node scripts/update-window-smoke.cjs
      - name: Verify request IP, body preview, blacklist, retention and export
        run: node scripts/request-records-smoke.cjs
      - name: Verify dialog transitions, focus and interrupted animations
        run: node scripts/overlays-smoke.cjs
      - name: Verify tunnel recovery after network changes
        run: node scripts/tunnel-recovery-smoke.cjs
      - name: Upload three packages and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --notes-file "docs/releases/$version.md"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG "release/ScrollBridge-$version-win-x64.zip" "release/ScrollBridge-Setup-$version-win-x64.exe" "release/ScrollBridge-$version-win-x64.exe" "release/scrollbridge-update.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
